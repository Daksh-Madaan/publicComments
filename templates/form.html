<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<style>
    * {
        font-family: "Space Grotesk", sans-serif;
        box-sizing: border-box;
    }

    body {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        flex-direction: column;
        gap: 1rem;
        margin: 0;
        padding: 1rem;
        min-height: 100vh;
    }

    form {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
    }

    textarea {
        width: 100%;
        height: 100px;
        font-size: 1rem;
        padding: 0.5rem;
        resize: vertical;
    }

    input {
        padding: 0.6rem;
        font-size: 1rem;
        cursor: pointer;
    }
</style>

<body>
    <form method="POST">
        <input type="text" placeholder="Username" name="username">
        <input type="password" placeholder="Password" name="passw">
        <input type="submit">
    </form>
    {% with m = get_flashed_messages() %}
    {% for i in m%}
        <p>{{i}}</p>
    {% endfor %}
    {% endwith %}
</body>

</html>
